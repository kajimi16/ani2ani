<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>放映会</title>
    <script>
      // Runs before first paint: the theme lives on <html> so the page never
      // flashes the wrong palette while the module script is still loading.
      try {
        const saved = localStorage.getItem("site-theme") || localStorage.getItem("studio-theme");
        const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : system;
      } catch {}
    </script>
    <link rel="stylesheet" href="/vendor/plyr.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/room.css" />
  </head>
  <body class="studio">
    <header class="d-header">
      <div class="d-header-inner">
        <a class="d-logo" href="/"><span class="d-logo-mark" aria-hidden="true"></span><span>放映会</span></a>
        <nav class="d-nav" aria-label="主导航">
          <a href="/">首页</a>
          <a href="/" aria-current="page">房间</a>
        </nav>
        <form class="d-search" id="searchForm" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="d-ico">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <input id="searchInput" type="search" placeholder="搜索房间" aria-label="搜索房间" />
        </form>
        <div class="d-icons">
          <button class="d-icon" id="themeToggle" type="button" title="切换夜间模式" aria-label="切换夜间模式">
            <svg class="d-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></svg>
            <svg class="d-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
          </button>
          <button class="d-icon" id="reload" type="button" title="重新载入" aria-label="重新载入">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.6 5.9M4 18v-5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <button class="d-icon" id="copyLink" type="button" title="复制链接" aria-label="复制链接">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l6-6M8 12l-2 2a3.5 3.5 0 0 0 5 5l2-2M16 12l2-2a3.5 3.5 0 0 0-5-5l-2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
          </button>
          <a class="d-primary" href="/">我要开播</a>
        </div>
      </div>
    </header>

    <nav class="d-subbar" aria-label="信号源">
      <div class="d-subbar-inner">
        <span class="d-src-tab">直播</span>
        <span class="d-src-tab is-ghost">回放</span>
        <span class="d-src-tab is-ghost">预约</span>
        <span class="d-subbar-sep" aria-hidden="true"></span>
        <button class="d-src is-active" type="button">主线路</button>
        <span class="d-subbar-status" id="navStatus">…</span>
      </div>
    </nav>

    <div class="d-shell">
      <main class="d-col">
        <section class="d-card d-roombar">
          <span class="d-avatar" aria-hidden="true">放</span>
          <div class="d-roominfo">
            <h1 id="roomTitle">…</h1>
            <p class="d-roommeta" id="roomSub"></p>
          </div>
        </section>

        <section class="d-card d-stage-card">
          <div class="d-stage">
            <stage-frame>
              <video id="video" playsinline autoplay muted></video>
              <div id="veil">
                <h3 id="veilTitle">等待房主开始</h3>
                <p id="veilText">页面开着就行，房主开始放映时这里会自动从同一帧播放。</p>
              </div>
            </stage-frame>

            <p class="pause-note" id="pauseNote" hidden>房主暂停了！</p>

            <div class="vote" id="vote" hidden>
              <span class="vote-fill" aria-hidden="true"></span>
              <span class="vote-text" id="voteText"></span>
              <span class="vote-timer" id="voteTimer">30</span>
              <span class="vote-actions">
                <button class="vote-yes" type="button" data-vote="yes">同意</button>
                <button class="vote-no" type="button" data-vote="no">反对</button>
              </span>
            </div>

            <p class="vote-toast" id="voteToast" hidden></p>
          </div>

          <!-- Outside the picture on purpose: a standing "you are out of sync"
               banner must not cover the film it is talking about. -->
          <div class="sync-bar" id="syncBar" hidden>
            <span id="syncBarText">与房主不同步</span>
            <button id="syncBarAction" type="button">对齐到房主</button>
            <button class="quiet" id="syncBarDismiss" type="button">留在这里</button>
          </div>

          <div class="d-actions">
            <button class="d-act" type="button" data-copy-link>复制链接</button>
            <button class="d-act" type="button" data-reload>重新载入</button>
            <a class="d-act" href="/">回到首页</a>
            <button class="d-act d-act-vote" id="voteStart" type="button" hidden>申请成为房主</button>
            <button class="d-act d-act-vote" id="transferStart" type="button" hidden>转交房主</button>
          </div>
        </section>

        <section class="d-card d-related">
          <div class="d-sec-head">
            <h2>正在放映</h2>
            <a href="/">全部 <span aria-hidden="true">›</span></a>
          </div>
          <div class="d-rel-grid" id="related"></div>
        </section>

        <owner-panel id="owner" hidden>
          <h2>房主</h2>

          <div class="row" id="uploadRow">
            <input type="file" id="file" accept="video/*,.mkv,.mp4,.webm,.mov,.avi,.ts,.m4v" />
            <button id="upload" type="button">上传并处理</button>
          </div>
          <div class="progress"><i id="uploadBar"></i></div>
          <p class="hint" id="uploadHint"></p>

          <div class="row">
            <button id="start" type="button" disabled>开始放映</button>
            <button id="startDelay" type="button" disabled>10 秒后开始</button>
            <button id="end" type="button" disabled>结束放映</button>
            <span class="spacer"></span>
            <button class="danger" id="remove" type="button">删除房间</button>
          </div>
          <p class="hint" id="ownerHint"></p>
          <p class="error" id="ownerError"></p>
        </owner-panel>
      </main>

      <aside class="d-chat" aria-label="弹幕">
        <div class="d-chat-head">
          <button class="d-tab is-active" type="button" data-tab="danmaku">弹幕</button>
          <button class="d-tab" type="button" data-tab="people">在线</button>
        </div>
        <p class="d-notice">文明观影，请勿剧透</p>

        <div class="d-pane" data-pane="danmaku">
          <section class="danmaku-panel" id="danmakuPanel">
            <ul id="danmakuList"></ul>
          </section>
        </div>

        <div class="d-pane" data-pane="people" hidden>
          <section class="people" id="people" hidden>
            <ul id="peopleList"></ul>
          </section>
          <p class="d-empty" id="peopleEmpty" hidden>还没有人进来。</p>
        </div>

        <div class="d-chat-input">
          <input id="danmakuInput" type="text" maxlength="120" placeholder="发一条弹幕" aria-label="弹幕内容" />
          <button id="danmakuSend" type="button">发送</button>
        </div>
        <p class="d-chat-status" id="danmakuStatus">连接中…</p>
      </aside>
    </div>

    <section class="lock" id="lock" hidden>
      <h2 id="lockTitle">私密房间</h2>
      <p class="hint" id="lockHint">这个房间是私密的，输入房主给的密码才能进。</p>
      <div class="field">
        <input id="lockPassword" type="password" maxlength="32" placeholder="房间密码" aria-label="房间密码" />
        <button id="lockSubmit" type="button">进入</button>
      </div>
      <p class="error" id="lockError" hidden></p>
    </section>

    <dialog class="d-picker" id="transferDialog">
      <div class="d-picker-body">
        <h2>把房主转交给</h2>
        <ul class="d-picker-list" id="transferList"></ul>
        <div class="d-picker-actions">
          <button class="d-quiet" type="button" data-close-transfer>取消</button>
        </div>
      </div>
    </dialog>

    <div class="stat-pop" id="statPop" hidden></div>

    <footer class="d-footer"><p id="footerMeta"></p></footer>
    <p id="status" class="sr-only"></p>

    <script type="module" src="/player.js"></script>
    <script type="module">
      const roomId = location.pathname.match(/^\/r\/([a-z0-9]{4,32})\/?$/)?.[1];
      const token = roomId ? localStorage.getItem(`room-token-${roomId}`) : null;

      // Remember the visit so the portal's "最近看过" rail lists real rooms rather
      // than a mock. Newest first, capped, and tolerant of a corrupt entry.
      if (roomId) {
        try {
          const previous = JSON.parse(localStorage.getItem("recentRooms") ?? "[]");
          const list = (Array.isArray(previous) ? previous : []).filter((entry) => entry?.id !== roomId);
          list.unshift({ id: roomId, at: Date.now() });
          localStorage.setItem("recentRooms", JSON.stringify(list.slice(0, 12)));
        } catch {
          /* quota or disabled storage: the rail just stays empty */
        }
      }

      const titleEl = document.getElementById("roomTitle");
      const navStatus = document.getElementById("navStatus");
      const veil = document.getElementById("veil");
      const veilTitle = document.getElementById("veilTitle");
      const veilText = document.getElementById("veilText");
      const ownerPanel = document.getElementById("owner");
      const fileInput = document.getElementById("file");
      const uploadButton = document.getElementById("upload");
      const uploadBar = document.getElementById("uploadBar");
      const uploadHint = document.getElementById("uploadHint");
      const startButton = document.getElementById("start");
      const startDelayButton = document.getElementById("startDelay");
      const endButton = document.getElementById("end");
      const removeButton = document.getElementById("remove");
      const uploadRow = document.getElementById("uploadRow");
      const ownerHint = document.getElementById("ownerHint");
      const ownerError = document.getElementById("ownerError");

      const STATUS_TEXT = {
        created: "等待上传",
        queued: "排队中",
        uploading: "上传中",
        transcoding: "处理中",
        ready: "待开播",
        live: "放映中",
        ended: "已结束",
        failed: "处理失败",
      };

      let lastStatus = null;

      function humanBytes(bytes) {
        if (!bytes) return "0 MB";
        if (bytes >= 1e9) return `${(bytes / 1e9).toFixed(2)} GB`;
        return `${(bytes / 1e6).toFixed(0)} MB`;
      }

      function setVeil(show, title, text = "") {
        veil.hidden = !show;
        if (title) veilTitle.textContent = title;
        // Always assign: a call with no text must clear the previous line rather
        // than leave a sentence from an earlier state on screen.
        veilText.textContent = text;
        veilText.hidden = text === "";
      }

      function render(room) {
        titleEl.textContent = room.title;
        navStatus.textContent = STATUS_TEXT[room.status] ?? room.status;
        document.title = `${room.title} · 放映会`;

        if (room.status !== lastStatus) {
          lastStatus = room.status;
          if (room.status === "ready") {
            setVeil(true, "等待房主开播");
          } else if (room.status === "live") {
            setVeil(false);
          } else if (room.status === "ended") {
            setVeil(true, "放映结束", "谢谢观看。");
          } else if (room.status === "failed") {
            setVeil(true, "处理失败", room.error ?? "请让房主重新上传。");
          } else {
            setVeil(true, "等待房主准备片源");
          }
        }

        const iAmHostNow = window.__screening?.isHost?.() ?? false;
        if (!token && !iAmHostNow) {
          ownerPanel.hidden = true;
          return;
        }
        ownerPanel.hidden = false;
        // Upload and delete stay owner-only: a host who arrived by vote runs the
        // screening, but does not own the room's files.
        uploadRow.hidden = !token;
        removeButton.hidden = !token;

        const busy = ["uploading", "transcoding", "queued"].includes(room.status);
        uploadButton.disabled = busy;
        // Ready to begin, already running (restart), or finished (replay): all
        // three can start a screening; the button just says which it is.
        const canStart = ["ready", "live", "ended"].includes(room.status);
        startButton.disabled = !canStart;
        startDelayButton.disabled = !canStart;
        endButton.disabled = room.status !== "live";
        startButton.textContent = room.status === "live" || room.status === "ended" ? "重新放映" : "开始放映";
        removeButton.disabled = busy;

        if (room.status === "queued") {
          const position = room.progress?.position ?? 1;
          uploadBar.style.width = "0%";
          uploadHint.textContent = `排队中，前面还有 ${Math.max(0, position - 1)} 个任务。`;
        } else if (room.status === "transcoding" && room.progress) {
          const percent = room.progress.percent * 100;
          uploadBar.style.width = `${percent}%`;
          uploadHint.textContent = `处理中 ${percent.toFixed(0)}%${room.progress.speed ? ` · ${room.progress.speed}` : ""}`;
        } else if (room.status === "ready" && room.sourceName) {
          uploadBar.style.width = "100%";
          uploadHint.textContent =
            `${room.sourceName} · ${humanBytes(room.sourceBytes)} · ` +
            `${room.segments ?? 0} 个分片 · ${Math.round(room.durationSec ?? 0)} 秒`;
        }

        ownerError.textContent = room.error ?? "";
      }

      async function refreshRoom() {
        if (!roomId) return;
        try {
          const response = await fetch(`/api/rooms/${roomId}`, {
            cache: "no-store",
            // The owner always gets through: the token is checked server-side, so
            // a private room still opens for whoever holds it.
            headers: token ? { "x-room-token": token } : {},
          });
          if (response.status === 403) {
            const payload = await response.json().catch(() => ({}));
            if (payload.locked) {
              showLock(payload.room ?? {});
              return;
            }
          }
          if (!response.ok) {
            setVeil(true, "房间不存在", "可能已被房主删除。");
            return;
          }
          const payload = await response.json();
          hideLock();
          render(payload.room);
          renderPeople(payload.room);
        } catch {
          /* transient; next poll retries */
        }
      }

      /* ------------------------------------------------------- private rooms */

      const lockEl = document.getElementById("lock");
      const lockTitle = document.getElementById("lockTitle");
      const lockPassword = document.getElementById("lockPassword");
      const lockSubmit = document.getElementById("lockSubmit");
      const lockError = document.getElementById("lockError");

      function showLock(room) {
        // The gate replaces the screening surface entirely, so nothing about the
        // film — not the player, not the danmaku stream — renders before access.
        document.body.classList.add("locked");
        lockEl.hidden = false;
        lockTitle.textContent = room.title || "私密房间";
        lockError.hidden = true;
      }

      function hideLock() {
        document.body.classList.remove("locked");
        lockEl.hidden = true;
      }

      async function submitUnlock() {
        const password = lockPassword.value;
        if (!password) return;
        lockSubmit.disabled = true;
        try {
          const response = await fetch(`/api/rooms/${roomId}/unlock`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ password }),
          });
          if (!response.ok) {
            const payload = await response.json().catch(() => ({}));
            lockError.textContent = payload.error ?? "密码不对";
            lockError.hidden = false;
            lockPassword.select();
            return;
          }
          // The cookie is what the player's segment requests carry, so a reload is
          // both the simplest and the most honest way to restart with access.
          location.reload();
        } catch {
          lockError.textContent = "连不上服务器";
          lockError.hidden = false;
        } finally {
          lockSubmit.disabled = false;
        }
      }

      lockSubmit.addEventListener("click", submitUnlock);
      lockPassword.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        submitUnlock();
      });

      document.addEventListener("room-state", (event) => render(event.detail));
      document.addEventListener("screening-ended", () => setVeil(true, "放映结束", "谢谢观看。"));
      // Replay: whatever the room status did, the picture is running again.
      document.addEventListener("screening-restarted", () => setVeil(false));

      /* -------------------------------------------------- host & sync UI */

      const syncBar = document.getElementById("syncBar");
      const syncBarText = document.getElementById("syncBarText");
      const syncBarAction = document.getElementById("syncBarAction");
      const syncBarDismiss = document.getElementById("syncBarDismiss");
      const peopleEl = document.getElementById("people");
      const peopleList = document.getElementById("peopleList");
      const transferStart = document.getElementById("transferStart");
      const transferDialog = document.getElementById("transferDialog");
      const transferList = document.getElementById("transferList");

      const screening = () => window.__screening;
      let latestRoom = null;

      // The host paused: say so, because the picture simply freezing looks like a
      // broken stream. The player only emits these on a transition, so the note
      // is not re-rendered every poll.
      const pauseNote = document.getElementById("pauseNote");
      let pauseNoteTimer = null;

      document.addEventListener("host-paused", () => {
        pauseNote.hidden = false;
        clearTimeout(pauseNoteTimer);
        // It is a nudge, not a status badge: three seconds is enough to explain
        // why the picture stopped.
        pauseNoteTimer = setTimeout(() => {
          pauseNote.hidden = true;
        }, 3000);
      });

      document.addEventListener("host-resumed", () => {
        clearTimeout(pauseNoteTimer);
        pauseNote.hidden = true;
      });

      // Two different reasons to show the bar: the viewer scrubbed away, or a
      // stall left them behind. The first offers no "dismiss", because dismissing
      // is what free mode already is.
      document.addEventListener("sync-mode", (event) => {
        const mode = event.detail?.mode;
        if (mode === "free") {
          syncBar.hidden = false;
          syncBarText.textContent = "你已离开房主的进度";
          syncBarDismiss.hidden = true;
        } else {
          syncBar.hidden = true;
        }
      });

      document.addEventListener("sync-lag-prompt", (event) => {
        const lag = event.detail?.lag ?? 0;
        syncBar.hidden = false;
        syncBarText.textContent = `落后房主 ${lag.toFixed(0)} 秒`;
        syncBarDismiss.hidden = false;
      });

      syncBarAction.addEventListener("click", () => {
        screening()?.alignToHost();
        syncBar.hidden = true;
      });

      syncBarDismiss.addEventListener("click", () => {
        screening()?.ignoreLag();
        syncBar.hidden = true;
      });

      // Auto-claim: whoever holds the token becomes host when the seat is empty.
      // Doing this on load keeps "the person who opened the room is the host"
      // true without an extra click, and re-claims if a previous host vanished.
      let claiming = false;
      // A failed claim must not be retried on the next poll: the server's 409
      // ("that viewer is not in the room right now") is stable for a while, and
      // an un-awaited refreshRoom() after it re-entered renderPeople → ensureHost
      // → POST at HTTP speed. Observed live: 34 requests inside one second.
      let claimCooldownUntil = 0;
      let claimBackoffMs = 1500;
      // When the recorded seat first looked abandoned. Reclaiming blindly is what
      // undid every transfer; identity now comes from the server, so this is just
      // a debounce against retrying on every poll.
      let leaderlessSince = 0;
      let myPeerId = null;
      async function ensureHost(room) {
        // A vacant seat is filled in exactly two ways now:
        //  - a fresh room (never assigned) by its owner, who holds the token;
        //  - a room whose host walked away by a vote (75% of the room).
        // Followers must NOT grab a leaderless seat on their own: that raced the
        // vote away (hostAway went false within a poll) and made one viewer host
        // without anyone agreeing.
        if (claiming || Date.now() < claimCooldownUntil) return;
        const unassigned = !room.hostPeerId;
        const leaderless = Boolean(room.hostPeerId) && room.hostAway;
        leaderlessSince = leaderless ? leaderlessSince || Date.now() : 0;

        // A fresh room is claimed by its owner. A seat whose holder vanished is
        // claimed back by the owner too, but only after 15 s of silence — a
        // transfer leaves the seat briefly "empty" until the new host reports,
        // and grabbing it then is exactly what used to undo every hand-over.
        // The server decides *who* may take the seat back (viewerId), so this is
        // only a debounce, not a safety margin.
        const ownerReclaim = leaderless && Date.now() - leaderlessSince > 3_000;
        // A fresh room belongs to whoever holds the token. A seat whose holder
        // vanished is reclaimed by that same person after 15 s — and "same person"
        // is decided by the server from the viewerId, because a host elected by a
        // vote has no token at all.
        if (unassigned && !token) return;
        if (!unassigned && !ownerReclaim) return;
        const me = window.__screening;
        if (!me) return;
        myPeerId = me.stats().peerId;
        claiming = true;
        try {
          const response = await fetch(`/api/rooms/${roomId}/host`, {
            method: "POST",
            headers: { "content-type": "application/json", "x-room-token": token },
            body: JSON.stringify({ peerId: myPeerId, selfPeerId: myPeerId, ownerToken: token }),
          });
          // Only a successful claim changes what the next poll would see, so only
          // that one is worth an immediate refresh.
          if (response.ok) {
            claimBackoffMs = 1500;
            refreshRoom();
          } else {
            // Retry soon enough to catch a transient "not live yet", then widen:
            // 1.5s → 3s → 6s → 10s. A flat long delay left the room leaderless
            // for ten seconds; no delay at all is the storm we just fixed.
            claimCooldownUntil = Date.now() + claimBackoffMs;
            claimBackoffMs = Math.min(claimBackoffMs * 2, 10_000);
          }
        } catch {
          // Network hiccup: back off the same way rather than spinning.
          claimCooldownUntil = Date.now() + claimBackoffMs;
          claimBackoffMs = Math.min(claimBackoffMs * 2, 10_000);
        } finally {
          claiming = false;
        }
      }

      function renderPeople(room) {
        latestRoom = room;
        const people = room.participants ?? [];
        const hostAway = room.hostAway;

        peopleEl.hidden = people.length === 0;
        peopleList.innerHTML = people
          .map((person) => {
            const label = person.name || `观众 ${person.peerId.slice(-4)}`;
            const tag = person.isHost ? '<em class="tag">房主</em>' : "";
            return `<li data-peer="${escapeHtml(person.peerId)}"${person.isHost ? ' class="is-host"' : ""}><span>${escapeHtml(label)}</span>${tag}</li>`;
          })
          .join("");

        if (hostAway) {
          peopleList.insertAdjacentHTML(
            "afterbegin",
            '<li class="host-away"><span>房主已离开</span><em class="tag warn">待接管</em></li>',
          );
        }

        void ensureHost(room);

        const me = screening();
        const iAmHost = me?.isHost?.() ?? false;
        const owned = Boolean(token);

        // Only the token holder can hand the room over; anyone can take an empty
        // seat, which is what keeps a screening alive after a crashed host.
        // A host elected by vote never had the owner token; the transfer control
        // must still be theirs.
        // One slot, two roles: the host hands the room over, everybody else can
        // stand for election. Never both.
        transferStart.hidden = !iAmHost || people.length < 2;
        voteStart.hidden = iAmHost;
        voteStart.disabled = Boolean(room.vote);

        const others = people.filter((person) => !person.isHost);
        transferList.innerHTML = others.length
          ? others
              .map(
                (person) =>
                  `<li><button type="button" data-target="${escapeHtml(person.peerId)}">${escapeHtml(
                    person.name || `观众 ${person.peerId.slice(-4)}`,
                  )}</button></li>`,
              )
              .join("")
          : '<li class="d-picker-empty">房间里还没有别人</li>';
        if (room.vote) showVote(room.vote);
        else if (voteShownId && votedId !== voteShownId) hideVote();

        if (room.voteResult && room.voteResult.id !== lastToastId) {
          lastToastId = room.voteResult.id;
          showVoteToast(room.voteResult);
        }
      }

      transferStart.addEventListener("click", () => transferDialog.showModal());
      document.querySelector("[data-close-transfer]").addEventListener("click", () => transferDialog.close());

      transferList.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-target]");
        if (!button) return;
        transferDialog.close();
        await fetch(`/api/rooms/${roomId}/host`, {
          method: "POST",
          headers: { "content-type": "application/json", "x-room-token": token, "x-viewer-id": viewerId ?? "" },
          body: JSON.stringify({ peerId: button.dataset.target, viewerId }),
        }).catch(() => {});
        // Pull the player's view of the seat forward before re-rendering, or the
        // action bar keeps showing the previous role for up to a poll.
        window.__screening?.refreshRoom?.();
        refreshRoom();
      });

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }

      // Leaving as host with an audience: ask before the tab closes. The browser
      // shows its own generic wording, which is enough of a speed bump to prompt
      // the handover the room needs.
      window.addEventListener("beforeunload", (event) => {
        if (!token) return;
        if (!screening()?.isHost?.()) return;
        if ((latestRoom?.participants ?? []).length < 2) return;
        event.preventDefault();
        event.returnValue = "";
      });

      /* ------------------------------------------------ 参与者悬浮数据卡 */

      // The host is the only one who needs per-person numbers, and they are only
      // interesting while looking at a specific person: fetch on hover, show next
      // to the row, dismiss on leave.
      const statPop = document.getElementById("statPop");

      function formatMiB(bytes) {
        return `${(Number(bytes || 0) / (1024 * 1024)).toFixed(1)} MiB`;
      }

      function statRows(client) {
        if (!client) return [["数据", "这个人的采样还没到"]];
        const downAll = (client.downP2P ?? 0) + (client.downHTTP ?? 0);
        const ratio = downAll > 0 ? ((client.downP2P / downAll) * 100).toFixed(1) : "0.0";
        const drift = Number(client.syncDrift ?? 0);
        return [
          ["P2P 占比", `${ratio}%`],
          ["下行", `${formatMiB(client.downP2P)} 来自 peer / ${formatMiB(client.downHTTP)} 来自服务器`],
          ["上行", formatMiB(client.upP2P)],
          ["分片", `${client.segmentsP2P ?? 0} 来自 peer / ${client.segmentsHTTP ?? 0} 来自服务器`],
          ["位置", `${Math.round(client.videoTime ?? 0)}s · 漂移 ${drift >= 0 ? "+" : ""}${drift.toFixed(1)}s`],
          ["连接", `${client.peers ?? 0} 个 peer`],
          ["角色", client.lead ? "领播种子" : "跟随者"],
        ];
      }

      function renderStatPop(rows) {
        statPop.innerHTML = rows
          .map(([key, value]) => `<div class="stat-row"><dt>${escapeHtml(key)}</dt><dd>${escapeHtml(value)}</dd></div>`)
          .join("");
      }

      function placeStatPop(event) {
        const rect = statPop.getBoundingClientRect();
        const x = Math.min(event.clientX + 16, window.innerWidth - rect.width - 12);
        const y = Math.min(event.clientY + 12, window.innerHeight - rect.height - 12);
        statPop.style.left = `${Math.max(12, x)}px`;
        statPop.style.top = `${Math.max(12, y)}px`;
      }

      let statRequest = 0;
      peopleList.addEventListener("mouseover", async (event) => {
        if (!window.__screening?.isHost?.()) return;
        const row = event.target.closest("li[data-peer]");
        if (!row || row.contains(event.relatedTarget)) return;

        const ticket = ++statRequest;
        renderStatPop([["数据", "读取中…"]]);
        statPop.hidden = false;
        placeStatPop(event);

        try {
          const response = await fetch(`/api/stats?room=${roomId}`, { cache: "no-store" });
          const payload = await response.json();
          if (ticket !== statRequest) return; // a newer hover won
          const client = (payload.window?.clients ?? []).find((entry) => entry.peerId === row.dataset.peer);
          renderStatPop(statRows(client));
        } catch {
          if (ticket === statRequest) renderStatPop([["数据", "读取失败"]]);
        }
        placeStatPop(event);
      });

      peopleList.addEventListener("mouseout", (event) => {
        if (event.relatedTarget && statPop.contains(event.relatedTarget)) return;
        statRequest += 1;
        statPop.hidden = true;
      });

      /* ---------------------------------------------------------- danmaku */

      const danmakuInput = document.getElementById("danmakuInput");
      const danmakuSend = document.getElementById("danmakuSend");
      const danmakuStatus = document.getElementById("danmakuStatus");

      document.addEventListener("danmaku-status", (event) => {
        const connected = event.detail?.connected;
        danmakuStatus.textContent = connected ? "" : "弹幕已断开，重连中…";
        // Only the button is disabled. Disabling a focused input blurs it and
        // drops the composition in progress, so a WiFi flap — and the 4 s
        // reconnect loop repeats it — would eat the pinyin being typed. The
        // text is kept and `send()` refuses while the socket is down, so the
        // composer stays usable and the status line carries the state.
        danmakuSend.disabled = !connected;
      });

      function sendDanmaku() {
        const api = window.__screening?.danmaku;
        if (!api) return;
        if (api.send(danmakuInput.value)) danmakuInput.value = "";
        danmakuInput.focus();
      }

      danmakuSend.addEventListener("click", sendDanmaku);

      // Enter belongs to the input method while a composition is open: it picks a
      // candidate or commits raw pinyin. Taking it — and preventDefault(), which
      // aborts the composition — sends the pinyin as a danmaku and drops what was
      // being typed, which reads as the IME stuttering every few keys.
      let composing = false;
      danmakuInput.addEventListener("compositionstart", () => {
        composing = true;
      });
      danmakuInput.addEventListener("compositionend", () => {
        // Chromium reports the committing Enter before compositionend, but other
        // engines report it after. Let the rest of this key event through, then
        // release the flag.
        setTimeout(() => {
          composing = false;
        }, 0);
      });
      danmakuInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        if (composing || event.isComposing || event.keyCode === 229) return;
        event.preventDefault();
        sendDanmaku();
      });

      refreshRoom();
      setInterval(refreshRoom, 3000);

      document.getElementById("copyLink").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(location.href);
        } catch {
          prompt("复制这个链接发给观众：", location.href);
        }
      });

      document.getElementById("reload").addEventListener("click", () => location.reload());

      /* ---------------------------------------------------------- owner ops */

      function ownerRequest(path, options = {}) {
        return fetch(`/api/rooms/${roomId}${path}`, {
          ...options,
          headers: { ...(options.headers ?? {}), "x-room-token": token, "x-viewer-id": viewerId ?? "" },
        });
      }

      uploadButton.addEventListener("click", () => {
        const file = fileInput.files?.[0];
        if (!file) {
          ownerError.textContent = "先选一个视频文件。";
          return;
        }
        ownerError.textContent = "";
        uploadButton.disabled = true;
        uploadHint.textContent = "上传中 0%";

        // XHR rather than fetch: upload progress is the only feedback during a
        // multi-minute transfer, and fetch still cannot report it.
        const request = new XMLHttpRequest();
        request.open("PUT", `/api/rooms/${roomId}/source`);
        request.setRequestHeader("x-room-token", token);
        request.setRequestHeader("x-filename", encodeURIComponent(file.name));
        request.setRequestHeader("content-type", "application/octet-stream");

        request.upload.addEventListener("progress", (event) => {
          if (!event.lengthComputable) return;
          const percent = (event.loaded / event.total) * 100;
          uploadBar.style.width = `${percent}%`;
          uploadHint.textContent =
            `上传中 ${percent.toFixed(0)}% · ${humanBytes(event.loaded)} / ${humanBytes(event.total)}`;
        });

        request.addEventListener("load", () => {
          if (request.status >= 200 && request.status < 300) {
            uploadHint.textContent = "上传完成，开始处理…";
            refreshRoom();
            return;
          }
          uploadButton.disabled = false;
          let message = request.responseText;
          try {
            message = JSON.parse(request.responseText).error ?? message;
          } catch {
            /* plain text body */
          }
          ownerError.textContent = `上传失败：${message}`;
        });

        request.addEventListener("error", () => {
          uploadButton.disabled = false;
          ownerError.textContent = "上传中断（网络断开？）。";
        });

        request.send(file);
      });

      async function start(delaySec) {
        startButton.disabled = true;
        startDelayButton.disabled = true;
        try {
          const response = await ownerRequest("/start", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ delaySec }),
          });
          if (!response.ok) {
            const payload = await response.json().catch(() => ({}));
            throw new Error(payload.error ?? response.statusText);
          }
          ownerHint.textContent = delaySec
            ? `${delaySec} 秒后开始，观众会自动对齐。`
            : "已开始，观众会自动对齐到同一帧。";
        } catch (error) {
          ownerError.textContent = `开始失败：${error.message}`;
        } finally {
          window.__screening?.refreshRoom?.();
          refreshRoom();
        }
      }

      startButton.addEventListener("click", () => start(0));
      startDelayButton.addEventListener("click", () => start(10));

      endButton.addEventListener("click", async () => {
        await ownerRequest("/end", { method: "POST" }).catch(() => {});
        window.__screening?.refreshRoom?.();
        refreshRoom();
      });

      removeButton.addEventListener("click", async () => {
        if (!confirm("删除这个房间？片源和转码结果都会被删掉。")) return;
        await ownerRequest("", { method: "DELETE" }).catch(() => {});
        localStorage.removeItem(`room-token-${roomId}`);
        location.href = "/";
      });


      /* ------------------------------------------------------- 全屏播放界面 */

      // Fullscreen gets the layout a video-on-demand player has: a title strip on
      // top, a two-row control bar (progress above the buttons) and an inline
      // danmaku composer, all inside Plyr's container so they survive fullscreen.
      // Everything that only makes sense in a window (quality, speed, follow) is
      // deliberately absent.
      function setupFullscreenUI() {
        const player = window.__screening?.plyr;
        const controls = document.querySelector(".plyr__controls");
        if (!player || !controls) return false;

        // --- top strip: what am I watching
        const head = document.createElement("div");
        head.className = "fs-head";
        head.innerHTML = '<span class="fs-title"></span>';
        document.querySelector(".plyr").appendChild(head);

        // --- merged time: 04:06 / 10:23
        const duration = document.querySelector(".plyr__time--duration");
        if (duration) duration.classList.add("fs-duration");
        const total = document.createElement("span");
        total.className = "plyr__time plyr__time--total";
        total.textContent = "/ 00:00";
        duration?.after(total);

        const format = (seconds) => {
          if (!Number.isFinite(seconds) || seconds < 0) return "00:00";
          const m = Math.floor(seconds / 60);
          const s = Math.floor(seconds % 60);
          return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        };
        const paintTotal = () => {
          total.textContent = `/ ${format(document.getElementById("video").duration)}`;
          const title = document.querySelector(".fs-title");
          if (title) title.textContent = document.getElementById("roomTitle").textContent;
        };
        player.on("timeupdate", paintTotal);
        player.on("loadedmetadata", paintTotal);
        paintTotal();

        // --- danmaku on/off + inline composer
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "plyr__controls__item plyr__control fs-dm-toggle";
        toggle.title = "弹幕开关";
        toggle.setAttribute("aria-label", "弹幕开关");
        toggle.textContent = "弹";
        let danmakuOn = localStorage.getItem("danmaku-off") !== "1";
        const paintToggle = () => {
          toggle.classList.toggle("is-off", !danmakuOn);
          document.documentElement.classList.toggle("danmaku-hidden", !danmakuOn);
        };
        paintToggle();
        toggle.addEventListener("click", () => {
          danmakuOn = !danmakuOn;
          try {
            localStorage.setItem("danmaku-off", danmakuOn ? "0" : "1");
          } catch {
            /* private mode */
          }
          paintToggle();
        });

        const composer = document.createElement("div");
        composer.className = "fs-dm";
        composer.innerHTML = '<input type="text" maxlength="120" placeholder="发个友善的弹幕见证当下" aria-label="弹幕内容" /><button type="button">发送</button>';
        const composerInput = composer.querySelector("input");
        const composerSend = composer.querySelector("button");

        const send = () => {
          const api = window.__screening?.danmaku;
          if (!api) return;
          if (api.send(composerInput.value)) composerInput.value = "";
        };
        composerSend.addEventListener("click", send);
        composerInput.addEventListener("keydown", (event) => {
          // Keep the keystroke away from Plyr's shortcuts (space toggles playback).
          event.stopPropagation();
          if (event.key !== "Enter" || event.isComposing) return;
          event.preventDefault();
          send();
        });
        composerInput.addEventListener("focus", () => document.querySelector(".plyr")?.classList.add("fs-typing"));
        composerInput.addEventListener("blur", () => document.querySelector(".plyr")?.classList.remove("fs-typing"));

        // Phones have no chat column beside the picture, so the composer needs a
        // door inside the player — but a permanent input row would eat most of a
        // 390px-wide screen. A small button reveals it on demand.
        const dmOpen = document.createElement("button");
        dmOpen.type = "button";
        dmOpen.className = "plyr__controls__item plyr__control dm-open-btn";
        dmOpen.title = "发弹幕";
        dmOpen.setAttribute("aria-label", "发弹幕");
        dmOpen.textContent = "发弹幕";
        dmOpen.addEventListener("click", () => {
          const container = document.querySelector(".plyr");
          container.classList.toggle("fs-dm-open");
          if (container.classList.contains("fs-dm-open")) composerInput.focus();
        });
        composerInput.addEventListener("blur", (event) => {
          // Tapping 发送 moves focus out of the input; the row must stay until the
          // click has landed, or the button vanishes under the finger.
          if (composer.contains(event.relatedTarget)) return;
          document.querySelector(".plyr")?.classList.remove("fs-dm-open");
        });

        controls.append(toggle, dmOpen, composer);

        // --- density curve above the progress rail
        const progress = document.querySelector(".plyr__progress__container");
        if (progress) {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "fs-heat");
          svg.setAttribute("viewBox", "0 0 100 24");
          svg.setAttribute("preserveAspectRatio", "none");
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          svg.appendChild(path);
          progress.appendChild(svg);

          const BUCKETS = 100;
          const counts = new Array(BUCKETS).fill(0);
          const draw = () => {
            const peak = Math.max(1, ...counts);
            const points = counts.map((value, index) => {
              const x = (index / (BUCKETS - 1)) * 100;
              const y = 22 - (value / peak) * 20;
              return `${x.toFixed(2)},${y.toFixed(2)}`;
            });
            path.setAttribute("d", `M0,24 L${points.join(" L")} L100,24 Z`);
          };
          document.addEventListener("danmaku-arrived", (event) => {
            const time = Number(event.detail?.videoTime);
            const span = document.getElementById("video").duration;
            if (!Number.isFinite(time) || !Number.isFinite(span) || span <= 0) return;
            const index = Math.min(BUCKETS - 1, Math.max(0, Math.floor((time / span) * BUCKETS)));
            counts[index] += 1;
            draw();
          });
        }

        return true;
      }

      // Plyr is created by the player module; wait for it instead of racing it.
      (function waitForPlayer(attempt = 0) {
        if (setupFullscreenUI() || attempt > 40) return;
        setTimeout(() => waitForPlayer(attempt + 1), 150);
      })();

      /* ------------------------------------------------------------- 房主投票 */

      // Identity for the ballot: the same stable id the player reports, so votes
      // survive a refresh the way the participant list does.
      const viewerId = (() => {
        try {
          const saved = localStorage.getItem("viewer-id");
          if (saved) return saved;
          const bytes = new Uint8Array(16);
          crypto.getRandomValues(bytes);
          const id = [...bytes].map((b) => b.toString(16).padStart(2, "0")).join("");
          localStorage.setItem("viewer-id", id);
          return id;
        } catch {
          return null;
        }
      })();

      const voteEl = document.getElementById("vote");
      const voteText = document.getElementById("voteText");
      const voteTimer = document.getElementById("voteTimer");
      const voteStart = document.getElementById("voteStart");
      const voteToast = document.getElementById("voteToast");
      let voteShownId = null;
      let votedId = null;
      let voteTicker = null;
      let toastTimer = null;
      let lastToastId = null;

      function peerId() {
        return window.__screening?.stats?.().peerId ?? null;
      }

      function hideVote() {
        clearInterval(voteTicker);
        voteTicker = null;
        voteEl.hidden = true;
        voteEl.classList.remove("chose-yes", "chose-no");
        voteShownId = null;
      }

      function tickVote(vote) {
        const left = Math.max(0, Math.ceil((vote.endsAt - Date.now()) / 1000));
        voteTimer.textContent = String(left);
        if (left === 0) clearInterval(voteTicker);
      }

      function showVote(vote) {
        if (!vote || votedId === vote.id) return;
        if (voteShownId === vote.id) {
          // Same vote, another ballot landed: only the counter changes, so the
          // slide-in must not replay.
          tickVote(vote);
          return;
        }
        voteShownId = vote.id;
        voteEl.hidden = false;
        voteEl.classList.remove("chose-yes", "chose-no");
        voteText.textContent = `${vote.candidateName || "有人"} 申请成为房主`;
        tickVote(vote);
        clearInterval(voteTicker);
        voteTicker = setInterval(() => tickVote(vote), 500);
      }

      async function castVote(approve) {
        const vote = voteShownId;
        if (!vote) return;
        votedId = vote;
        // The chosen colour spreads across the banner, which then lingers a
        // second before going away.
        voteEl.classList.add(approve ? "chose-yes" : "chose-no");
        try {
          await fetch(`/api/rooms/${roomId}/vote/cast`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ approve, peerId: peerId(), viewerId }),
          });
        } catch {
          /* the result broadcast still arrives */
        }
        setTimeout(hideVote, 1000);
      }

      voteEl.querySelectorAll("[data-vote]").forEach((button) =>
        button.addEventListener("click", () => castVote(button.dataset.vote === "yes")),
      );

      function showVoteToast(result) {
        const won = Boolean(result?.approved);
        voteToast.textContent = won
          ? `${result.candidateName || "有人"} 成为了房主`
          : `${result.candidateName || "有人"} 没能成为房主`;
        voteToast.classList.toggle("is-pass", won);
        voteToast.classList.toggle("is-fail", !won);
        voteToast.hidden = false;
        // Must outlast the CSS run (7 s) or the toast is cut off mid-flight.
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          voteToast.hidden = true;
        }, 7400);
      }

      document.addEventListener("vote-state", (event) => showVote(event.detail));
      document.addEventListener("vote-result", (event) => {
        // The seat may have changed hands: refresh now instead of waiting for the
        // next poll, so the buttons flip together with the announcement.
        window.__screening?.refreshRoom?.();
        refreshRoom();
        // If this screen just cast a ballot, let the colour flood finish and the
        // banner linger its second before it goes; otherwise the result would cut
        // the animation off mid-way.
        const casting = !voteEl.hidden && (voteEl.classList.contains("chose-yes") || voteEl.classList.contains("chose-no"));
        if (casting) setTimeout(() => {
          hideVote();
          showVoteToast(event.detail);
        }, 900);
        else {
          hideVote();
          showVoteToast(event.detail);
        }
      });

      voteStart.addEventListener("click", async () => {
        voteStart.disabled = true;
        try {
          const response = await fetch(`/api/rooms/${roomId}/vote`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ peerId: peerId(), viewerId }),
          });
          if (!response.ok) {
            const payload = await response.json().catch(() => ({}));
            showVoteToast({ candidateName: payload.error ?? "发起失败", approved: false });
          }
        } finally {
          voteStart.disabled = false;
        }
      });

      /* ----------------------------------------------------------- 明暗主题 */

      const themeToggle = document.getElementById("themeToggle");
      const THEME_KEY = "site-theme";

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        const toDark = theme !== "dark";
        const label = toDark ? "切换夜间模式" : "切换白天模式";
        themeToggle.setAttribute("aria-label", label);
        themeToggle.title = label;
      }

      applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");

      themeToggle.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next);
        try {
          localStorage.setItem(THEME_KEY, next);
        } catch {
          /* private mode: the choice just does not persist */
        }
      });

      /* ------------------------------------------------------- 页面外壳行为 */

      // Tabs swap two real panes: the danmaku stream and the people list.
      const tabs = [...document.querySelectorAll(".d-tab")];
      const panes = [...document.querySelectorAll(".d-pane")];
      const peopleEmpty = document.getElementById("peopleEmpty");

      function showPane(name) {
        tabs.forEach((tab) => tab.classList.toggle("is-active", tab.dataset.tab === name));
        panes.forEach((pane) => {
          pane.hidden = pane.dataset.pane !== name;
        });
        if (name === "people") {
          peopleEmpty.hidden = document.getElementById("peopleList").children.length > 0;
        }
      }

      tabs.forEach((tab) => tab.addEventListener("click", () => showPane(tab.dataset.tab)));

      // Header icons are the only real controls; the action chips delegate so
      // there is one implementation of each.
      document
        .querySelector("[data-copy-link]")
        .addEventListener("click", () => document.getElementById("copyLink").click());
      document
        .querySelector("[data-reload]")
        .addEventListener("click", () => document.getElementById("reload").click());

      // The search box belongs to the portal, not this page: hand the query over.
      document.getElementById("searchForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const query = document.getElementById("searchInput").value.trim();
        location.href = query ? `/?q=${encodeURIComponent(query)}` : "/";
      });

      // "正在放映" rail: other rooms, fetched once. It is decoration only if the
      // server has nothing else to show, which is the honest empty state.
      (async () => {
        const grid = document.getElementById("related");
        try {
          const payload = await (await fetch("/api/rooms", { cache: "no-store" })).json();
          const others = (payload.rooms ?? []).filter((room) => room.id !== roomId).slice(0, 3);
          if (others.length === 0) {
            grid.innerHTML = '<p class="d-empty">暂时没有别的房间。</p>';
            return;
          }
          grid.innerHTML = others
            .map((room) => {
              // Titles and host names are user-supplied, and room ids come from the
              // server: everything is escaped before it reaches innerHTML.
              const cover = room.poster
                ? `<img src="${escapeHtml(room.poster)}" alt="" loading="lazy" />`
                : "";
              const badge = room.status === "live" ? `${Number(room.viewers) || 0} 人在看` : "待开播";
              const title = escapeHtml(room.title || "未命名放映");
              const host = room.hostName ? `房主 ${escapeHtml(room.hostName)}` : "暂无房主";
              return `<a class="d-rel" href="/r/${escapeHtml(room.id)}">
                <div class="d-rel-cover">${cover}<span class="d-rel-badge">${badge}</span></div>
                <p class="d-rel-title">${title}</p>
                <p class="d-rel-meta">${host}</p>
              </a>`;
            })
            .join("");
        } catch {
          grid.innerHTML = '<p class="d-empty">载入失败。</p>';
        }
      })();
    </script>
  </body>
</html>
